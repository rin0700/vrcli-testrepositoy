
name: VRChat Preflight Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrchat-unity
  cancel-in-progress: false

jobs:
  preflight:
    name: VRChat SDK Check
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      
      - name: Setup Git LFS
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$PATH"

          if ! git lfs version > /dev/null 2>&1; then
            brew install git-lfs
          fi

      - name: Checkout Unity project
        uses: actions/checkout@v6
        with:
          lfs: true

      
      - name: Restore and verify Git LFS
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          # LFSファイルを作業フォルダに復元
          git lfs pull

          # SDKに必要なDLLの実体を確認
          DLLS=(
            "Packages/com.vrchat.base/Runtime/VRCSDK/Plugins/DOTween/DOTween.dll"
            "Packages/com.vrchat.base/Runtime/VRCSDK/Plugins/VRCSDKBase.dll"
            "Packages/com.vrchat.base/Runtime/VRCSDK/Plugins/VRCCore-Editor.dll"
          )

          for DLL in "${DLLS[@]}"; do
            if [ ! -f "$DLL" ]; then
              echo "::error::Missing DLL: $DLL"
              exit 1
            fi

            if head -c 80 "$DLL" | grep -aq '^version https://git-lfs.github.com/spec/v1'; then
              echo "::error::Unresolved LFS pointer: $DLL"
              exit 1
            fi

            echo "OK: $DLL"
            ls -lh "$DLL"
          done

          echo "Git LFS verification passed"


      - name: Validate Unity project
        shell: bash
        run: |
          test -d Assets
          test -d Packages
          test -f Packages/vpm-manifest.json
          test -f ProjectSettings/ProjectVersion.txt
          echo "Unity project found"

      
      
      - name: Run VRCLI preflight
        shell: bash
        env:
          VRCLI_USERNAME: ${{ secrets.VRCHAT_LOGIN }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.dotnet/tools:$PATH"

          if [ -z "${VRCLI_USERNAME:-}" ]; then
            echo "::error::VRCHAT_LOGIN secret is missing or empty"
            exit 1
          fi

          vrcli check \
            --project "$GITHUB_WORKSPACE" \
            --scene "Assets/_Rin/Scene/VRCli_Test.unity" \
            --platform StandaloneWindows64 \
            --plain


