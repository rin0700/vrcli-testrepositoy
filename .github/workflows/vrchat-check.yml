
name: VRChat Preflight Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrchat-unity
  cancel-in-progress: false

jobs:
  preflight:
    name: VRChat SDK Check
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      
      - name: Setup Git LFS
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$PATH"

          if ! git lfs version > /dev/null 2>&1; then
            brew install git-lfs
          fi

      - name: Checkout Unity project
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Validate Unity project
        shell: bash
        run: |
          test -d Assets
          test -d Packages
          test -f Packages/vpm-manifest.json
          test -f ProjectSettings/ProjectVersion.txt
          echo "Unity project found"

      
      
      - name: Run VRCLI preflight
        shell: bash
        env:
          VRCLI_USERNAME: ${{ secrets.VRCHAT_LOGIN }}
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.dotnet/tools:$PATH"

          if [ -z "${VRCLI_USERNAME:-}" ]; then
            echo "::error::VRCHAT_LOGIN secret is missing or empty"
            exit 1
          fi

          vrcli check \
            --project "$GITHUB_WORKSPACE" \
            --scene "Assets/_Rin/Scene/VRCli_Test.unity" \
            --platform StandaloneWindows64 \
            --plain


