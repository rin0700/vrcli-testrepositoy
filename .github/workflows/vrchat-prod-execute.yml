name: VRChat - Execute Approved Production Upload

on:
  workflow_dispatch:
    inputs:
      reservation_issue:
        description: 'Signed production reservation Issue number (started by scheduler)'
        required: true
        type: string

jobs:
  claim:
    name: Check and consume signed reservation
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    concurrency:
      group: vrchat-production-claim
      cancel-in-progress: false
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
      world_id: ${{ steps.verify.outputs.world_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      VRC_QUEUE_SIGNING_KEY: ${{ secrets.VRC_QUEUE_SIGNING_KEY }}
      VRC_DEPLOY_OPERATORS: ${{ vars.VRC_DEPLOY_OPERATORS }}
      VRC_PROD_ALLOWED_IDS: ${{ vars.VRC_PROD_ALLOWED_IDS }}
      VRC_TEST_ALLOWED_IDS: ${{ vars.VRC_TEST_ALLOWED_IDS }}
      ISSUE_NUMBER: ${{ inputs.reservation_issue }}
    steps:
      - name: Checkout trusted booking controller
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Check booking, PR, test evidence and signature
        id: verify
        run: python3 scripts/vrchat_ci.py claim

  production:
    name: Mac-side authorized production deployment
    needs: claim
    runs-on: [self-hosted, macOS, ARM64]
    environment: vrchat-production
    timeout-minutes: 150
    concurrency:
      group: vrchat-unity
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ISSUE_NUMBER: ${{ inputs.reservation_issue }}
    steps:
      - name: Request GitHub OIDC proof and invoke isolated Mac broker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REQUEST' | sudo -n -u vrchatprod /opt/vrchat-prod/.venv/bin/python /opt/vrchat-prod/broker.py
          import json, os, urllib.parse, urllib.request
          audience = 'urn:vrchat:prod:' + os.environ['GITHUB_REPOSITORY']
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': audience})
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          print(json.dumps({'oidc_token': token, 'reservation_issue': os.environ['ISSUE_NUMBER']}))
          PY_REQUEST

  audit:
    name: Record deployment result
    if: always() && needs.claim.result == 'success'
    needs: [claim, production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.reservation_issue }}
      JOB_STATUS: ${{ needs.production.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Write result comment
        run: python3 scripts/vrchat_ci.py complete
